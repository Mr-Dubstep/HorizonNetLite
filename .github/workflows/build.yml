name: Build HorizonNet Lite APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform 33
      run: sdkmanager "platforms;android-33"

    - name: Build APK
      run: |
        mkdir -p build/dex
        cd app/src/main

        javac -classpath $ANDROID_HOME/platforms/android-33/android.jar \
              -d ../../../build \
              java/com/horizonnet/lite/MainActivity.java

        d8 ../../../build/com/horizonnet/lite/MainActivity.class \
           --output ../../../build/dex

        aapt package -f -m -F ../../../build/HorizonNetLite-unsigned.apk \
          -M AndroidManifest.xml \
          -S res \
          -A assets \
          -I $ANDROID_HOME/platforms/android-33/android.jar

        cd ../../../build
        aapt add HorizonNetLite-unsigned.apk dex/classes.dex

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore mykey.keystore -storepass password \
          -alias key -keypass password -dname "CN=Voltix,O=HorizonNet,C=DE" \
          -keyalg RSA -keysize 2048 -validity 10000

        apksigner sign --ks mykey.keystore --ks-pass pass:password \
          --out HorizonNetLite.apk HorizonNetLite-unsigned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HorizonNetLite
        path: |
          build/HorizonNetLite.apk
