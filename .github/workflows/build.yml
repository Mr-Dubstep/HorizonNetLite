- name: Build APK
      run: |
        mkdir -p build/dex
        mkdir -p app/src/main/res
        cd app/src/main

        # Compile Java
        javac -classpath $ANDROID_HOME/platforms/android-33/android.jar \
              -d ../../../build \
              java/com/horizonnet/lite/MainActivity.java

        # Convert to DEX
        d8 ../../../build/com/horizonnet/lite/MainActivity.class \
           --output ../../../build/dex

        # Package unsigned APK
        $ANDROID_HOME/build-tools/33.0.0/aapt package -f -m \
          -F ../../../build/HorizonNetLite-unsigned.apk \
          -M AndroidManifest.xml \
          -S res \
          -A assets \
          -I $ANDROID_HOME/platforms/android-33/android.jar

        # Add classes.dex into the APK
        cd ../../../build
        $ANDROID_HOME/build-tools/33.0.0/aapt add HorizonNetLite-unsigned.apk dex/classes.dex

        # Generate signing key
        keytool -genkey -v -keystore mykey.keystore -storepass password \
          -alias key -keypass password -dname "CN=Voltix,O=HorizonNet,C=DE" \
          -keyalg RSA -keysize 2048 -validity 10000

        # Sign final APK → THIS creates build/HorizonNetLite.apk
        $ANDROID_HOME/build-tools/33.0.0/apksigner sign \
          --ks mykey.keystore --ks-pass pass:password \
          --out HorizonNetLite.apk \
          HorizonNetLite-unsigned.apk
