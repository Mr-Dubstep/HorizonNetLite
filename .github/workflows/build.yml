name: Build HorizonNet Lite APK

on:
  push:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Step 1: Checkout the repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3


      # ---------------------------------------------------------
      # Step 2: Install Java Development Kit (JDK)
      # ---------------------------------------------------------
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'


      # ---------------------------------------------------------
      # Step 3: Install Android SDK base environment
      # ---------------------------------------------------------
      - name: Install Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # Step 4: Install Android platform 33
      # ---------------------------------------------------------
      - name: Install Android platform 33
        run: |
          sdkmanager "platforms;android-33"


      # ---------------------------------------------------------
      # Step 5: Install Android build-tools 33.0.0
      # ---------------------------------------------------------
      - name: Install Android build-tools
        run: |
          sdkmanager "build-tools;33.0.0"


      # ---------------------------------------------------------
      # Step 6: Build, package, and sign the APK
      # ---------------------------------------------------------
      - name: Build and sign APK
        run: |
          set -e

          echo "Preparing directories..."
          mkdir -p build
          mkdir -p build/dex
          mkdir -p app/src/main/res

          echo "Entering app/src/main..."
          cd app/src/main

          echo "Compiling Java source..."
          javac -classpath $ANDROID_HOME/platforms/android-33/android.jar \
                -d ../../../build \
                java/com/horizonnet/lite/MainActivity.java

          echo "Converting to DEX..."
          d8 ../../../build/com/horizonnet/lite/MainActivity.class \
             --output ../../../build/dex

          echo "Packaging unsigned APK..."
          $ANDROID_HOME/build-tools/33.0.0/aapt package -f -m \
            -F ../../../build/HorizonNetLite-unsigned.apk \
            -M AndroidManifest.xml \
            -S res \
            -A assets \
            -I $ANDROID_HOME/platforms/android-33/android.jar

          echo "Entering build directory..."
          cd ../../../build

          echo "Adding classes.dex to APK..."
          $ANDROID_HOME/build-tools/33.0.0/aapt add \
            HorizonNetLite-unsigned.apk \
            dex/classes.dex

          echo "Generating signing key..."
          keytool -genkey -v \
            -keystore mykey.keystore \
            -storepass password \
            -alias key \
            -keypass password \
            -dname "CN=Voltix,O=HorizonNet,C=DE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          echo "Signing final APK..."
          $ANDROID_HOME/build-tools/33.0.0/apksigner sign \
            --ks mykey.keystore \
            --ks-pass pass:password \
            --out HorizonNetLite.apk \
            HorizonNetLite-unsigned.apk

          echo "Final APK created:"
          ls -l HorizonNetLite.apk


      # ---------------------------------------------------------
      # Step 7: Upload the final APK as an artifact
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonNetLite
          path: build/HorizonNetLite.apk
